name: CPU instruction tests

on:
  push:
    branches: [main, public-main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  cpu:
    name: CPU (${{ matrix.os }}, superopcodes=${{ matrix.superopcodes }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            superopcodes: 'true'
          - os: ubuntu-latest
            superopcodes: 'false'
          - os: windows-latest
            superopcodes: 'true'
          - os: macos-latest
            superopcodes: 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build libc++-20-dev libc++abi-20-dev
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Verify pinned offline corpus
        run: dotnet run --project tests/cpu/tools/FexImport -c Release -- verify
      - name: Run deterministic boundaries and imported regressions
        run: dotnet test Fiberish.X86.Tests/Fiberish.X86.Tests.csproj -c Release -p:FibercpuBakingPreset=${{ matrix.superopcodes == 'false' && 'custom' || '3m' }} -p:EnableSuperOpcodes=${{ matrix.superopcodes }} --filter "Category!=Exhaustive" --logger "trx;LogFileName=cpu.trx" --blame-hang-timeout 3m
      - name: Run exhaustive byte arithmetic
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: dotnet test Fiberish.X86.Tests/Fiberish.X86.Tests.csproj -c Release --no-build --filter "Category=Exhaustive" --logger "trx;LogFileName=cpu-exhaustive.trx" --blame-hang-timeout 5m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-results-${{ matrix.os }}-${{ matrix.superopcodes }}
          path: Fiberish.X86.Tests/TestResults/**
