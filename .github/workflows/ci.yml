name: CI

on:
  push:
    branches:
      - main
      - public-main
  pull_request:

permissions:
  contents: read

jobs:
  native-tooling:
    name: Native tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v

  build-linux:
    name: Build Linux core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build libc++-20-dev libc++abi-20-dev
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - name: Build Linux-compatible projects
        run: |
          dotnet build Podish.Cli/Podish.Cli.csproj -c Debug
          dotnet build Podish.Core.Native/Podish.Core.Native.csproj -c Debug
          dotnet build Podish.PjdFs/Podish.PjdFs.csproj -c Debug
          dotnet build Fiberish.Tests/Fiberish.Tests.csproj -c Debug
          dotnet build Fiberish.SilkFS.Tests/Fiberish.SilkFS.Tests.csproj -c Debug
          dotnet build Podish.Pulse.Tests/Podish.Pulse.Tests.csproj -c Debug
          dotnet build Podish.Wayland.Tests/Podish.Wayland.Tests.csproj -c Debug

  build-windows:
    name: Build Windows PodishCli
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows-compatible projects
        run: |
          # Project graph instances can share a native CMake tree. Do not run
          # their configure/cache-replacement steps concurrently on a clean runner.
          dotnet build Podish.Cli/Podish.Cli.csproj -c Debug -r win-x64 -m:1
          dotnet build Fiberish.X86/Fiberish.X86.csproj -c Debug -r win-x64 -m:1
        shell: pwsh

  publish-windows:
    name: Publish Windows PodishCli NativeAOT
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish Windows PodishCli NativeAOT
        run: dotnet publish Podish.Cli/Podish.Cli.csproj -c Release -r win-x64 -p:PublishAot=true -m:1
        shell: pwsh

      - name: Upload Windows publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: podishcli-win-x64-nativeaot-publish
          path: Podish.Cli/bin/Release/net11.0/win-x64/publish/**

  publish-linux:
    name: Publish Linux PodishCli NativeAOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build libc++-20-dev libc++abi-20-dev
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - name: Publish Linux PodishCli NativeAOT
        run: dotnet publish Podish.Cli/Podish.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -m:1

      - name: Upload Linux publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: podishcli-linux-x64-nativeaot-publish
          path: Podish.Cli/bin/Release/net11.0/linux-x64/publish/**

  build-macos:
    name: Build macOS full solution
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          brew install cmake ninja

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Build full solution
        run: dotnet build Podish.slnx -c Debug -m:1

  publish-macos:
    name: Publish macOS PodishCli NativeAOT
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          brew install cmake ninja

      - name: Publish macOS PodishCli NativeAOT
        run: dotnet publish Podish.Cli/Podish.Cli.csproj -c Release -r osx-arm64 -p:PublishAot=true -m:1

      - name: Upload macOS publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: podishcli-osx-arm64-nativeaot-publish
          path: Podish.Cli/bin/Release/net11.0/osx-arm64/publish/**
